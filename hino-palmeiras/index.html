<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hino do Palmeiras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      max-width: 320px;
      width: 100%;
      background: #181818;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #282828;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }
    
    /* Cartão de dedicatória personalizada */
    #custom-message {
      display: none; /* Só aparece se houver o parâmetro na URL */
      background: linear-gradient(135deg, rgba(255, 153, 0, 0.15), rgba(255, 100, 0, 0.05));
      border: 1px dashed #ff9900;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #ffb84d;
      font-style: italic;
      line-height: 1.3;
      word-break: break-word;
    }

    img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 16px;
      border: 1px solid #333;
    }
    h1 {
      font-size: 1.4rem;
      color: #ff9900;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 0.95rem;
      color: #b3b3b3;
      font-weight: 400;
      margin-bottom: 18px;
    }
    .lyrics {
      font-size: 0.85rem;
      color: #ff9900;
      background: rgba(255, 153, 0, 0.1);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 153, 0, 0.3);
    }
    audio {
      width: 100%;
      accent-color: #ff9900;
    }
    #tap-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(18, 18, 18, 0.85);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    #tap-overlay .play-icon {
      width: 64px;
      height: 64px;
      background: #ff9900;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(255, 153, 0, 0.4);
    }
    #tap-overlay .play-icon svg {
      fill: #121212;
      width: 28px;
      height: 28px;
      margin-left: 4px;
    }
    #tap-overlay span {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="tap-overlay">
      <div class="play-icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <span>Toque para ouvir</span>
    </div>

    <!-- Caixa onde entra o recado personalizado -->
    <div id="custom-message"></div>

    <img src="palmeiras.jpg" alt="Capa">
    <h1>Hino do Palmeiras</h1>
    <h2>Verdão</h2>
    <div class="lyrics">
      "No gramado em que a luta o aguarda"
    </div>
    <audio id="player" controls src="hino_palmeiras.mp3"></audio>
  </div>

  <script>
    // Captura e exibe a mensagem personalizada via URL
    const urlParams = new URLSearchParams(window.location.search);
    const message = urlParams.get('msg');
    
    if (message) {
      const msgBox = document.getElementById('custom-message');
      msgBox.textContent = `“${message}”`;
      msgBox.style.display = 'block';
    }

    // Controle de reprodução
    const player = document.getElementById('player');
    const overlay = document.getElementById('tap-overlay');

    player.currentTime = 08;

    function startPlayback() {
      player.play().then(() => {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 300);
      }).catch((err) => {
        console.log("Aguardando toque:", err);
      });
    }

    window.addEventListener('load', () => {
      startPlayback();
    });

    overlay.addEventListener('click', startPlayback);
    overlay.addEventListener('touchstart', startPlayback);
  </script>

</body>
</html>
