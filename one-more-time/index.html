<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daft Punk - One More Time</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 320px;
      width: 100%;
      background: #181818;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #282828;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 16px;
      border: 1px solid #333;
    }
    h1 {
      font-size: 1.4rem;
      color: #ff9900;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 0.95rem;
      color: #b3b3b3;
      font-weight: 400;
      margin-bottom: 18px;
    }
    .lyrics {
      font-size: 0.85rem;
      color: #ff9900;
      background: rgba(255, 153, 0, 0.1);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 153, 0, 0.3);
    }
    audio {
      width: 100%;
      accent-color: #ff9900;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="daft_punk_one_more_time.jpg" alt="Interstella 5555 - Daft Punk">
    <h1>One More Time</h1>
    <h2>Daft Punk</h2>
    <div class="lyrics">
      "One more time, we're gonna celebrate"
    </div>
    <audio id="player" controls autoplay src="Daft_Punk_One_More_Time.mp3"></audio>
  </div>

  <script>
    const player = document.getElementById('player');
    
    // Inicia no timestamp exato de 01:23 gravado na peça física
    player.currentTime = 83;

    // Tenta dar autoplay se o navegador permitir
    window.addEventListener('load', () => {
      player.play().catch(() => {
        // Navegadores mobile podem exigir um toque na tela para iniciar o som
      });
    });
  </script>

</body>
</html>
